[workspace]
resolver = "2"
members = [
    "crates/pagar-policy",
    "crates/pagar-firewall",
    "crates/pagar-vault",
    "crates/pagar-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["E. Brillianto <koodoxz@gmail.com>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/koodoxz/pagar"
description = "Zero-copy MCP tool-call firewall, secret exfiltration guard, and atomic blast-radius rollback engine for AI agents"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.14"
pagar-policy = { path = "crates/pagar-policy" }
pagar-firewall = { path = "crates/pagar-firewall" }
pagar-vault = { path = "crates/pagar-vault" }

